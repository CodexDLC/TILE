[project]
name = "atlas"
version = "0.1.0"
description = "My new project scaffolded with codex-django"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.0",
    "python-dotenv",
    "dj-database-url",
    "psycopg2-binary",
    "loguru",
    "redis>=5.0",
    "arq>=0.25",
    "aiosmtplib>=3.0",
    "codex-ai[gemini]==0.2.6",
    "codex-core==0.5.0",
    "codex-django[cli]==0.7.0",
    "codex-django-cli==0.4.0",
    "codex-platform==0.6.0",
    "codex-services==0.1.4",
    "django-unfold>=0.20.0",
    "django-modeltranslation>=0.20.0",
    "markdown-it-py>=4.0.0",
    "django-allauth[socialaccount]",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "django-stubs",
    "ruff",
    "bandit",
    "pre-commit",
    "pip-audit",
    "detect-secrets",
]

[project.scripts]
manage = "atlas.manage:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "RUF"]
ignore = ["S101", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/**/migrations/*.py" = ["E501", "RUF012", "S608"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas", "src/workers"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "atlas.core.settings.test"
# Keep the library's development-mode Redis bypass active during local tests.
django_debug_mode = true
pythonpath = [".", "src", "src/atlas"]
testpaths = ["tests"]

[tool.codex-check]
project-name = "atlas"
integration-requires = "PostgreSQL, Redis"
test-stages = ["unit", "integration"]
prompt-test-stages = ["integration"]
allow-empty-test-stages = ["integration"]
live-output-test-stages = ["integration"]
test-paths = ["tests"]
test-markers = { unit = "" }
types-paths = ["src"]
run-extra-checks = true
