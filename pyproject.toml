[project]
name = "atlas"
version = "0.1.0"
description = "My new project scaffolded with codex-django"
dependencies = [
    "django>=5.0",
    "python-dotenv",
    "dj-database-url",
    "psycopg2-binary",
    "loguru",
    "redis>=5.0",
    "codex-core",
    "codex-django[cli]",
    "django-unfold>=0.20.0",
    "django-modeltranslation>=0.20.0",
    "markdown-it-py>=4.0.0",
    "django-allauth[socialaccount]",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "django-stubs",
    "ruff",
    "bandit",
    "pre-commit",
    "pip-audit",
    "detect-secrets",
]

[project.scripts]
manage = "atlas.manage:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "RUF"]
ignore = ["S101", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/**/migrations/*.py" = ["E501", "RUF012", "S608"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "atlas.core.settings.test"
pythonpath = [".", "src", "src/atlas"]
testpaths = ["tests"]

[tool.uv.sources]
codex-ai = { path = "../../codex_tools/codex-ai", editable = true }
codex-core = { path = "../../codex_tools/codex-core", editable = true }
codex-django = { path = "../../codex_tools/codex-django", editable = true }
codex-django-cli = { path = "../../codex_tools/codex-django-cli", editable = true }
codex-platform = { path = "../../codex_tools/codex-platform", editable = true }
codex-services = { path = "../../codex_tools/codex_services", editable = true }

[tool.codex-check]
project-name = "atlas"
integration-requires = "PostgreSQL, Redis"
test-stages = ["unit", "integration"]
prompt-test-stages = ["integration"]
allow-empty-test-stages = ["integration"]
live-output-test-stages = ["integration"]
test-paths = ["tests"]
types-paths = ["src"]
run-extra-checks = true

[[tool.codex-check.extra-commands]]
name = "Docker Lint (Hadolint)"
command = ["hadolint", "deploy/atlas/django.Dockerfile"]
skip-if-missing = "hadolint"
