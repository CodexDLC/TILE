<section class="section block-gallery">
    <div class="container">
        <div class="section-header">
            {% if block.heading %}<h2>{{ block.heading }}</h2>{% endif %}
            {% if block.intro %}<p class="lead">{{ block.intro }}</p>{% endif %}
        </div>
        <div class="block-gallery-grid">
            {% for item in block.images.all %}
                <figure class="block-gallery-item">
                    <img src="{{ item.image.url }}" alt="{{ item.alt_text|default:item.caption }}">
                    {% if item.caption %}<figcaption>{{ item.caption }}</figcaption>{% endif %}
                </figure>
            {% endfor %}
        </div>
    </div>
</section>
