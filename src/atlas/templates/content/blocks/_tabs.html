<section class="section block-tabs">
    <div class="container">
        <div class="section-header">
            {% if block.heading %}<h2>{{ block.heading }}</h2>{% endif %}
            {% if block.intro %}<p class="lead">{{ block.intro }}</p>{% endif %}
        </div>
        <div class="block-tab-list">
            {% for item in block.items.all %}
                <article class="card">
                    <p class="card-index">{{ item.label }}</p>
                    {% if item.heading %}<h3>{{ item.heading }}</h3>{% endif %}
                    {% if item.body %}<p>{{ item.body }}</p>{% endif %}
                </article>
            {% endfor %}
        </div>
    </div>
</section>
