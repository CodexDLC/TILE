{% load i18n %}
<form action="{% if search_action %}{{ search_action }}{% else %}{% url 'places-search' %}{% endif %}" method="get" class="atlas-search" role="search">
<label for="atlas-query">{% trans "City, place or story" %}</label>
<div><input id="atlas-query" type="search" name="q" value="{{ query }}" maxlength="200"><button class="btn btn-primary" type="submit">{% trans "Search" %}</button></div>
</form>
