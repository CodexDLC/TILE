{% if entries %}
<details class="nav-dropdown" @click.outside="$el.open = false" @keydown.escape="if ($el.open) { $event.stopPropagation(); $el.open = false; $el.querySelector('summary').focus() }">
    <summary class="nav-link nav-dropdown-toggle">{{ label }} <span aria-hidden="true">⌄</span></summary>
    <div class="nav-dropdown-menu">
        {% for entry in entries %}
            <a href="{{ entry.page.absolute_path }}" class="nav-dropdown-link{% if request.path == entry.page.absolute_path %} active{% endif %}"{% if request.path == entry.page.absolute_path %} aria-current="page"{% endif %} @click="$el.closest('details').open = false; mobileMenuOpen = false">{{ entry.name }}</a>
        {% endfor %}
    </div>
</details>
{% endif %}
