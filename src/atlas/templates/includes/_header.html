{% load i18n %}

<header class="header" x-data="{ mobileMenuOpen: false }" @keydown.escape.window="mobileMenuOpen = false">
    <div class="header-inner">
        <a href="{% url 'home' %}" class="logo-link">
            <span class="logo-mark" aria-hidden="true"></span>
            <span class="logo-wordmark"><span class="logo-text">T.A.L.E.</span><span class="logo-subtitle" lang="en">{{ public_brand_full }}</span></span>
        </a>

        <nav class="nav-desktop" aria-label="{% trans 'Primary navigation' %}">
            <a href="{% url 'home' %}" class="nav-link {% if nav_is_home %}active{% endif %}">{% trans "Home" %}</a>
            <a href="{% url 'places-stories' %}" class="nav-link {% if nav_is_stories %}active{% endif %}">{% trans "Stories" %}</a>
        </nav>

        <div class="header-actions">
            <a class="header-icon-link header-project-link" href="{% url 'project-concept' %}" aria-label="{% trans 'About the project' %}" title="{% trans 'About the project' %}">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                    <path d="M12 6.5C9 4.5 6 4.5 3 5.5v13c3-1 6-1 9 1 3-2 6-2 9-1v-13c-3-1-6-1-9 1v13"/>
                </svg>
            </a>
            <a class="header-icon-link" href="{% url 'places-search' %}" aria-label="{% trans 'Search' %}">
                <span aria-hidden="true">⌕</span>
            </a>
            <nav class="header-language" aria-label="{% trans 'Language' %}">
                {% for language in language_switcher %}<a href="{{ language.url }}" lang="{{ language.code }}" {% if language.is_active %}aria-current="true"{% endif %}>{{ language.code|upper }}</a>{% endfor %}
            </nav>
            <button class="burger-btn" type="button" data-mobile-menu-opener @click="mobileMenuOpen = true" :aria-expanded="mobileMenuOpen.toString()" aria-controls="atlas-mobile-menu" aria-label="{% trans 'Open menu' %}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <template x-teleport="body">
        <div id="atlas-mobile-menu" class="mobile-menu" x-show="mobileMenuOpen" x-cloak>
            <div class="mobile-menu-backdrop" @click="mobileMenuOpen = false" aria-hidden="true"></div>
            <div class="mobile-menu-panel" role="dialog" aria-modal="true" aria-label="{% trans 'Mobile navigation' %}" tabindex="-1" data-mobile-menu-panel>
                <div class="mobile-menu-header">
                    <span class="logo-wordmark"><span class="logo-text">T.A.L.E.</span><span class="logo-subtitle" lang="en">{{ public_brand_full }}</span></span>
                    <button class="close-btn" type="button" data-mobile-menu-close @click="mobileMenuOpen = false" aria-label="{% trans 'Close menu' %}">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <nav class="mobile-nav" aria-label="{% trans 'Mobile navigation' %}">
                    <a href="{% url 'home' %}" class="mobile-nav-link" @click="mobileMenuOpen = false">{% trans "Home" %}</a>
                    <a href="{% url 'places-stories' %}" class="mobile-nav-link" @click="mobileMenuOpen = false">{% trans "Stories" %}</a>
                </nav>

                <div class="mobile-menu-meta">
                    {% if site_settings.site_description %}
                        <p class="text-muted">{{ site_settings.site_description }}</p>
                    {% endif %}
                    {% if site_settings.phone %}
                        <a href="tel:{{ site_settings.phone }}" class="btn btn-primary btn-block">{{ site_settings.phone }}</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </template>
</header>
